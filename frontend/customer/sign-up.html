    <title>Sign Up</title>

<body>
    <header>
        <h1>E-Commerce Website</h1>

    <center>
        <form action="../../backend/customer/sign-up.php" method="post" style="margin-top: 60px;">
            <fieldset>
                <h2><i>Sign Up</i></h2>
                <label>Full Name:</label><br>
                <input type="text" name="full_name" required><br><br>
                <label>Address:</label><br>
                <input type="text" name="address" required><br><br>
                <label>Phone Number:</label><br>
                <input type="tel" name="phone_number" required><br><br>
                <label>Email:</label><br>
                <input type="email" name="email" required><br><br>
                <label>Password:</label><br>
                <input type="password" name="password" required><br><br><br><br>
                <a href=""><button type="submit">Sign Up</button></a>
            </fieldset>
        </form>
